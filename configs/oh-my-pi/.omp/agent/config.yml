setupVersion: 1
theme: 
  light: light-catppuccin
  dark: dark-catppuccin
statusLine: 
  preset: nerd
  separator: pipe
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
  showHookStatus: true
tui: 
  textSizing: false
  tight: false
display: 
  shimmer: classic
includeWorkspaceTree: false
personality: pragmatic
retry: 
  usageAwareFallback: false
advisor: 
  enabled: false
interruptMode: immediate
tools:
  approvalMode: write
bash: 
  patterns: 
    - match: "wc *"
      approval: allow
    - match: "cd *"
      approval: allow
    - match: "echo * > *"
      approval: prompt
    - match: "echo * >> *"
      approval: prompt
    - match: "echo * | sh*"
      approval: prompt
    - match: "echo * | bash*"
      approval: prompt
    - match: "echo *"
      approval: allow
    - match: "*.pem*"
      approval: deny
    - match: "*.key*"
      approval: deny
    - match: "*.p12*"
      approval: deny
    - match: "*.jks*"
      approval: deny
    - match: "*/.ssh/*"
      approval: deny
    - match: "*/.gnupg/*"
      approval: deny
    - match: "*/.aws/*"
      approval: deny
    - match: "*/.azure/*"
      approval: deny
    - match: "*/.kube/*"
      approval: deny
    - match: "*/.docker/*"
      approval: deny
    - match: "*/.config/gcloud/*"
      approval: deny
    - match: "*.env*"
      approval: prompt
    - match: "rm *"
      approval: prompt
    - match: "sudo rm *"
      approval: prompt
    - match: "chmod -R *"
      approval: prompt
    - match: "chmod 000 *"
      approval: prompt
    - match: "chmod 0 *"
      approval: prompt
    - match: "chown *"
      approval: prompt
    - match: "sudo chown *"
      approval: prompt
    - match: "dd *"
      approval: prompt
    - match: "mkfs*"
      approval: prompt
    - match: "shutdown*"
      approval: prompt
    - match: "reboot*"
      approval: prompt
    - match: "halt*"
      approval: prompt
    - match: "poweroff*"
      approval: prompt
    - match: "init 0*"
      approval: prompt
    - match: "init 6*"
      approval: prompt
    - match: "killall *"
      approval: prompt
    - match: "pkill *"
      approval: prompt
    - match: "kill -9 *"
      approval: prompt
    - match: "git push --force*"
      approval: prompt
    - match: "git push -f*"
      approval: prompt
    - match: "git reset --hard*"
      approval: prompt
    - match: "git clean -f*"
      approval: prompt
    - match: "git checkout -- *"
      approval: prompt
    - match: "git restore *"
      approval: prompt
    - match: "git diff*"
      approval: allow
    - match: "git status*"
      approval: allow
    - match: "git log*"
      approval: allow
    - match: "git show*"
      approval: allow
    - match: "git branch*"
      approval: allow
    - match: "git remote*"
      approval: allow
    - match: "git config user.*"
      approval: allow
    - match: "git config --get*"
      approval: allow
    - match: "wget *"
      approval: prompt
    - match: "ssh *"
      approval: prompt
    - match: "scp *"
      approval: prompt
    - match: "brew install *"
      approval: prompt
    - match: "npm publish *"
      approval: prompt
    - match: "curl * -X*"
      approval: prompt
    - match: "curl * --request*"
      approval: prompt
    - match: "curl * -d*"
      approval: prompt
    - match: "curl * --data*"
      approval: prompt
    - match: "curl * -F*"
      approval: prompt
    - match: "curl * --form*"
      approval: prompt
    - match: "curl * -T*"
      approval: prompt
    - match: "curl * --upload-file*"
      approval: prompt
    - match: "curl * --json*"
      approval: prompt
    - match: "curl * -o*"
      approval: prompt
    - match: "curl * --output*"
      approval: prompt
    - match: "curl * -O*"
      approval: prompt
    - match: "curl * --remote-name*"
      approval: prompt
    - match: "curl *"
      approval: allow
    - match: "jq *>*"
      approval: prompt
    - match: "jq *"
      approval: allow
    - match: "mkdir*"
      approval: allow
    - match: "ls*"
      approval: allow
    - match: "cat*"
      approval: allow
    - match: "grep*"
      approval: allow
    - match: "rg*"
      approval: allow
    - match: "nl*"
      approval: allow
    - match: "find*"
      approval: allow
    - match: "sort*"
      approval: allow
    - match: "head*"
      approval: allow
    - match: "tail*"
      approval: allow
    - match: "bash -n*"
      approval: allow
    - match: "shellcheck*"
      approval: allow
    - match: "tree*"
      approval: allow
    - match: "which *"
      approval: allow
    - match: "javap *"
      approval: allow
    - match: "unzip -l*"
      approval: allow
    - match: "xmllint --noout*"
      approval: allow
    - match: "xmllint --format*"
      approval: allow
    - match: "./mvnw clean test*"
      approval: allow
    - match: "./mvnw -q clean test*"
      approval: allow
    - match: "./mvnw clean compile*"
      approval: allow
    - match: "./mvnw clean test-compile*"
      approval: allow
    - match: "./mvnw -q clean test-compile*"
      approval: allow
    - match: "./mvnw dependency:tree*"
      approval: allow
    - match: "./mvnw -q dependency:tree*"
      approval: allow
    - match: "./mvnw -DskipTests dependency:tree*"
      approval: allow
    - match: "./mvnw -q -DskipTests dependency:tree*"
      approval: allow
    - match: "./mvnw dependency:build-classpath*"
      approval: allow
    - match: "mvn dependency:get*"
      approval: allow
completion: 
  notify: "on"
error: 
  notify: "on"
stt: 
  enabled: true
marketplace: 
  autoUpdate: notify
power: 
  sleepPrevention: idle
features: 
  unexpectedStopDetection: false
contextPromotion: 
  enabled: false
memory: 
  backend: local
autolearn: 
  enabled: false
  autoContinue: false
edit: 
  mode: hashline
read: 
  renderMarkdown: true
  toolResultPreview: true
lsp: 
  formatOnWrite: false
astGrep: 
  enabled: true
dev: 
  autoqa: false
task: 
  enableEffort: false
  enableLsp: true
  isolation: 
    commits: ai
providers: 
  webSearchOrder: 
    - google
    - duckduckgo
    - public
secrets: 
  enabled: true
modelRoles:
  default: opencode-go/glm-5.3:medium
  smol: google-antigravity/gemini-3.7-flash:high
  slow: opencode-go/qwen3.8-max:high
  plan: opencode-go/kimi-k3:meduim
composer:
  shape: pi
